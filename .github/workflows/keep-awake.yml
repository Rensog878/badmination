# Keeps the free Render web service awake (it sleeps after 15 min without traffic).
# Pings the cheap /api/health endpoint (no database call, no page render).
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables →
#   New repository variable: SITE_URL = https://<your-service>.onrender.com
#
# Notes:
# - GitHub may delay scheduled runs by a few minutes at busy times; for stricter uptime,
#   also add a free UptimeRobot / cron-job.org monitor on the same URL.
# - Render's free plan gives 750 instance hours per month, enough for one service 24/7.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL repository variable is not set; skipping."
            exit 0
          fi
          # A sleeping instance takes ~1 min to wake, so allow a generous timeout and retries.
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 10 \
            "${SITE_URL%/}/api/health"
