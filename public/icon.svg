<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- App Background Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Court Line Rings -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#greenGrad)" stroke-width="4" opacity="0.3"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="10 8" opacity="0.4"/>
  <!-- Glowing Shuttlecock Emblem -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)" filter="url(#glow)">
    <!-- Cork Base -->
    <path d="M 230 350 C 230 380, 282 380, 282 350 Z" fill="#f3f4f6"/>
    <path d="M 230 350 L 282 350 L 282 340 L 230 340 Z" fill="#10b981"/>
    <!-- Feather Skirt Outline -->
    <path d="M 230 340 L 175 170 C 215 158, 297 158, 337 170 L 282 340 Z" fill="none" stroke="#f3f4f6" stroke-width="14" stroke-linejoin="round"/>
    <!-- Feather Shafts -->
    <line x1="243" y1="340" x2="220" y2="166" stroke="#f3f4f6" stroke-width="7"/>
    <line x1="256" y1="340" x2="256" y2="162" stroke="#10b981" stroke-width="9"/>
    <line x1="269" y1="340" x2="292" y2="166" stroke="#f3f4f6" stroke-width="7"/>
    <!-- Thread bindings -->
    <path d="M 205 255 C 230 246, 282 246, 307 255" fill="none" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>
    <path d="M 188 210 C 220 200, 292 200, 324 210" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
