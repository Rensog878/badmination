# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI Code Review Configuration for Badmination
# High-rigor, automated review standards for Next.js 15, React 19, and Olympic-grade Sports UI

language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "dev"

  tools:
    eslint:
      enabled: true
    typescript:
      enabled: true
    ast-grep:
      enabled: true

  path_filters:
    - "!public/draco/**"
    - "!.next/**"
    - "!node_modules/**"
    - "!package-lock.json"

  path_instructions:
    - path: "app/**"
      instructions: |
        - Verify Next.js 15 App Router conventions (Server Components by default, 'use client' only where interactive state/hooks exist).
        - Ensure proper error boundaries (error.tsx) and loading skeletons (loading.tsx).
        - Strict TypeScript: no 'any', ensure params/searchParams are properly handled (as Promises in Next 15).
        - Verify URL param sanitization and SEO metadata.

    - path: "components/**"
      instructions: |
        - Review React 19 hooks and lifecycle methods. Ensure hooks always run before early returns.
        - Verify accessibility: aria labels, role attributes, keyboard navigability, high-contrast states.
        - Check sports UI readability: tabular-nums for scores, timestamps, and statistics.
        - Ensure mobile-first responsive layout (iPhone, Android, tablet, desktop).

    - path: "lib/live/**"
      instructions: |
        - Review real-time badminton scoring engine against official BWF rally point rules (games to 21, 2-point lead, 30-point cap).
        - Verify memory leaks in timers, SSE connections, or event listeners.
        - Verify concurrency safety and idempotent score state updates.

    - path: "app/admin/**"
      instructions: |
        - Review role-based authorization guards on all server actions and API routes.
        - Verify CSRF protection, input validation via Zod, and rate-limiting.

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
